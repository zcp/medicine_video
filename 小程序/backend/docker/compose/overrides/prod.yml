# 生产环境覆盖：后端不暴露宿主机端口，使用命名卷
#
# 路径相对本文件：docker/compose/overrides/ → 仓库根为 ../../../

services:
  postgres:
    ports: []

  redis:
    ports: []

  live_core_service:
    ports: []
    expose:
      - "8000"

  user_service:
    ports: []
    expose:
      - "8002"

  media_download_service:
    ports: []
    expose:
      - "8001"

  srs:
    ports: []
    expose:
      - "1935"
      - "8080"

  nginx:
    ports:
      - "80:80"
      - "443:443"
      - "8080:80"
    volumes:
      - ../../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../../nginx/ssl:/etc/nginx/ssl:ro
      - ../../../data/srs:/var/www/srs:ro
      - live-core-media:/var/www/html/live-core-media:ro
      - users-uploads:/var/www/html/users-uploads:ro
