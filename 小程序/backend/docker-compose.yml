# Live Streaming SaaS - 主 Compose 入口（Linux / 远程服务器）
#
# 用法:
#   docker compose up -d                          # 启动全栈
#   docker compose up -d --build --no-deps live_core_service  # 仅重建 live_core（不碰库）
#
# ⚠️ 禁止日常使用 down -v / DROP DATABASE：会清数据。
#    仅重建代码镜像（保留账号与全部库）: rebuild-live-core-only.bat / .sh
#    仅重置 live_core 库（仍保留 users 账号）: reset-live-core-db.bat / .sh
#
# Windows 本地开发请使用:
#   docker compose -f docker-compose.yml -f docker-compose.windows.yml up -d
#   快捷: start-dev.bat  /  dc-dev.bat up -d

include:
  - docker/compose/base.yml
  - docker/compose/infra.yml
  - docker/compose/apps.yml
  - docker/compose/edge.yml
