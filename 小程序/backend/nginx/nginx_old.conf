events {}

http {
    include /etc/nginx/mime.types;

    # 上游定义
    upstream core_api   { server live_core_service:8000; }
    upstream dl_api     { server media_download_service:8001; }
    upstream users_api { server user_service:8002; }
    upstream srs_stream { server srs:8080; }

    # ---------- 内部回调专用 ----------
    server {
        listen 8009;                    # 只监听容器内部 8009
        server_name _;                  # 任意域名
        location /api/v1/internal/srs/ {
            proxy_pass http://core_api/api/v1/internal/srs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

# HTTP 服务器块 (80 端口)
server {
    listen 80;
    server_name 124.220.235.226;

    client_max_body_size 10M;  # 设置稍大于应用限制，避免边界问题
        # 设置超时时间
    client_body_timeout 60s;

    # 静态资源处理
    location /assets/ {
        root /var/www/html/user-service;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 用户服务 API
    location /api/users/ {
        proxy_pass http://users_api/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 主页面
    location / {
        root /var/www/html//user-service;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
   server {

        listen 443 ssl;
        server_name mp.dayilive.com 124.220.235.226;  # ← 添加域名

        client_max_body_size 10M;  # 设置稍大于应用限制，避免边界问题
        # 设置超时时间
        client_body_timeout 60s;
        ssl_certificate /var/www/mp.dayilive.com/fullchain.pem;
        ssl_certificate_key /var/www/mp.dayilive.com/privkey.pem;

        #ssl_certificate /etc/nginx/ssl/server.pem;   # 替换为你的证书路径
        #ssl_certificate_key /etc/nginx/ssl/server.key; # 替换为你的私钥路径

    # ===== 重定向规则 =====
    location = /user-service {
        return 301 https://124.220.235.226/;
    }

    location = /user-service/ {
        return 301 https://124.220.235.226/;
    }

    location ~ ^/user-service/(.*)$ {
        return 301 https://124.220.235.226/$1;
    }
        # ===== 用户服务前端 - 主页面 =====
        location / {
            root /var/www/html/user-service;
            index index.html;
            try_files $uri $uri/ /index.html;

            # 静态资源缓存
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                root /var/www/html/user-service;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # 新增：处理静态资源请求
        location /assets/ {
            root /var/www/html/user-service;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 全局配置文件路径（用于 live-center 前端）
        # 注意：这个必须在 /live-center 配置之前，避免被其他规则覆盖
        location /config/ {
            alias /var/www/html/live-center/config/;
            expires 1h;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
        # 修改：前端静态文件服务 - 改为 /download-center 路径
        location /download-center {
            alias /var/www/html/media-download/;
            index index.html;
            try_files $uri $uri/ /download-center/index.html;

            # 静态资源缓存
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
# ===== 下载中心静态资源 =====
location /download-center/assets/ {
    alias /var/www/html/media-download/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /download-center/config/ {
    alias /var/www/html/media-download/config/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}


   # ===== 直播前端 (vzan_simul_frontend) =====
    # 注意：location 顺序很重要，更精确的匹配要放在前面
    # 实际文件在 /var/www/html/live-center// 目录下

    # 直播前端配置文件（必须在最前面，使用精确匹配）
    location /live-center/config/ {
        alias /var/www/html/live-center/config/;
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 直播前端静态资源目录（精确匹配，避免被正则覆盖）
    location /live-center/assets/ {
        root /var/www/html/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 直播前端静态文件（JS/CSS/图片等）- 正则匹配，放在精确匹配之后
    location ~* ^/live-center/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 直播前端主路径（放在最后，作为 fallback）
        # 直播前端主路径（放在最后，作为 fallback）
    location /live-center {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ @live_center_fallback;
    }

    # 直播前端 fallback 处理（避免重定向循环）
    location @live_center_fallback {
        rewrite ^/live-center(.*)$ /live-center/index.html last;
    }

        #  新增：前端API代理 - 这样前端就可以通过服务名访问后端了
        location /api/v1/ {
            proxy_pass http://dl_api/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS支持（如果需要）
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        }

        # ---- FastAPI 服务 ----
        location /api/core/ {
            proxy_pass http://core_api/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/dl/ {
            proxy_pass http://dl_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 新增：用户服务
location /api/users/ {
    proxy_pass http://users_api/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
        # ---- SRS 媒体流 ----
        # HLS
        location /hls {
            alias /var/www/srs/live;
            #alias /var/www/live-streaming-saas-v2/data/srs/live;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        # HTTP-FLV / 控制台
        location /live/ {
            proxy_pass http://srs_stream/live/;
            add_header Access-Control-Allow-Origin *;
        }

        # SRS Web 控制台
        location /srs {
            proxy_pass http://srs_stream;
        }

        # 可选：统一静态资源
        location /static/ {
            alias /var/www/static/;
        }
    }
}