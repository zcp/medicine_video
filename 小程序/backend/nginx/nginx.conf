events {}

http {
    include /etc/nginx/mime.types;

    # ============================================================================
    # 上游服务定义
    # ============================================================================
    upstream core_api {
        server live_core_service:8000;
    }
    upstream dl_api {
        server media_download_service:8001;
    }
    upstream users_api {
        server user_service:8002;
    }
    upstream srs_stream {
        server srs:8080;
    }

    # ============================================================================
    # 内部回调专用服务器（仅容器内部访问）
    # ============================================================================
    server {
        listen 8009;
        server_name _;

        location /api/v1/internal/srs/ {
            proxy_pass http://core_api/api/v1/internal/srs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================================================
    # HTTP 服务器（80 端口）
    # ============================================================================
    server {
        listen 80;
        server_name 124.220.235.226;

        client_max_body_size 10M;
        client_body_timeout 60s;

        # 直播核心服务媒体文件（必须放在所有 /api/ 路径之前）
        location /media/ {
            alias /var/www/html/live-core-media/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;

            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
            }

            try_files $uri =404;
        }

        # 用户服务前端静态资源
        location /assets/ {
            root /var/www/html/user-service;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 用户服务：认证接口单独转发（/api/users/auth/ → /api/v1/auth/）
        location /api/users/auth/ {
            proxy_pass http://users_api/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户服务：管理端接口（/api/users/admin/ → /api/v1/admin/）
        location /api/users/admin/ {
            proxy_pass http://users_api/api/v1/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户服务：内部接口（/api/users/internal/ → /api/v1/internal/；V2 头像同步等）
        # 须放在 /api/users/ 之前，避免被 rewrite 到 /api/v1/users/internal/
        location /api/users/internal/ {
            proxy_pass http://users_api/api/v1/internal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户服务：用户信息接口（/api/users/me → /api/v1/users/me）
        location /api/users/ {
            proxy_pass http://users_api/api/v1/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 直播核心服务 API（80端口也需要，微信小程序通过 localhost:8080 访问）
        location /api/core/ {
            proxy_pass http://core_api/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 媒体下载服务 API
        location /api/dl/ {
            proxy_pass http://dl_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户上传文件（头像等）
        location /uploads/ {
            proxy_pass http://users_api/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public";
        }

        # 用户服务前端主页面
        location / {
            root /var/www/html/user-service;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ============================================================================
    # HTTPS 服务器（443 端口）
    # ============================================================================
    server {
        listen 443 ssl;
        server_name mp.dayilive.com 124.220.235.226;

        client_max_body_size 10M;
        client_body_timeout 60s;

        # SSL 证书配置
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ========================================================================
        # 重定向规则
        # ========================================================================
        location = /user-service {
            return 301 https://124.220.235.226/;
        }

        location = /user-service/ {
            return 301 https://124.220.235.226/;
        }

        location ~ ^/user-service/(.*)$ {
            return 301 https://124.220.235.226/$1;
        }

        # ========================================================================
        # 用户服务前端（user-service）
        # ========================================================================
        location / {
            root /var/www/html/user-service;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            root /var/www/html/user-service;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ========================================================================
        # 下载中心前端（download-center）
        # ========================================================================
        location /download-center {
            alias /var/www/html/media-download/;
            index index.html;
            try_files $uri $uri/ /download-center/index.html;
        }

        location /download-center/assets/ {
            alias /var/www/html/media-download/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /download-center/config/ {
            alias /var/www/html/media-download/config/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ========================================================================
        # 直播前端（live-center）
        # 注意：location 顺序很重要，更精确的匹配要放在前面
        # ========================================================================
        # 配置文件（每个前端项目使用自己的配置路径，避免冲突）
        location /live-center/config/ {
            alias /var/www/html/live-center/config/;
            expires 1h;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # 静态资源目录（精确匹配，使用 ^~ 前缀确保优先匹配）
        location ^~ /live-center/assets/ {
            root /var/www/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # 静态文件（JS/CSS/图片等）- 正则匹配，排除 assets 目录
        location ~* ^/live-center/(?!assets/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /var/www/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 主路径（放在最后，作为 fallback）
        location /live-center {
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ @live_center_fallback;
        }

        # Fallback 处理（避免重定向循环）
        location @live_center_fallback {
            rewrite ^/live-center(.*)$ /live-center/index.html last;
        }

        # ========================================================================
        # 直播核心服务媒体文件（必须放在所有 /api/ 路径之前）
        # ========================================================================
        location /media/ {
            alias /var/www/html/live-core-media/;
            expires 7d;  # 缓存7天
            add_header Cache-Control "public";
            access_log off;  # 静态文件不记录访问日志，提升性能

            # 支持图片格式（含 webp）
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
            }

            # 如果文件不存在，返回 404（不转发给后端）
            try_files $uri =404;
        }

        # ========================================================================
        # API 代理服务
        # ========================================================================
        # 图片代理（必须放在 /api/core/ 之前，避免被其他 location 匹配）
        location /api/image {
            proxy_pass https://a2.vzan.com;
            proxy_set_header Host a2.vzan.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Referer https://a2.vzan.com/;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            
            # 重写路径（移除 /api/image 前缀）
            rewrite ^/api/image(.*)$ $1 break;
        }

        # 直播核心服务 API
        location /api/core/ {
            proxy_pass http://core_api/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 直播核心服务 API（专家 & 个人直播间等 /api/v1/ 前缀的路由）
        # 必须放在 /api/v1/ 通用规则之前，使用 ^~ 前缀匹配确保优先
        location ^~ /api/v1/experts {
            proxy_pass http://core_api/api/v1/experts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /api/v1/featured-experts {
            proxy_pass http://core_api/api/v1/featured-experts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /api/v1/users/me/rooms {
            proxy_pass http://core_api/api/v1/users/me/rooms;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /api/v1/users/me/followed-experts {
            proxy_pass http://core_api/api/v1/users/me/followed-experts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 媒体下载服务 API
        location /api/dl/ {
            proxy_pass http://dl_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 媒体下载服务 API v1
        location /api/v1/ {
            proxy_pass http://dl_api/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS 支持
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        }

        # 用户服务：认证接口单独转发（/api/users/auth/ → /api/v1/auth/）
        location /api/users/auth/ {
            proxy_pass http://users_api/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户服务：管理端接口（/api/users/admin/ → /api/v1/admin/）
        location /api/users/admin/ {
            proxy_pass http://users_api/api/v1/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户服务：内部接口（/api/users/internal/ → /api/v1/internal/；V2 头像同步等）
        # 须放在 /api/users/ 之前，避免被 rewrite 到 /api/v1/users/internal/
        location /api/users/internal/ {
            proxy_pass http://users_api/api/v1/internal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户服务：用户信息接口（/api/users/me → /api/v1/users/me）
        location /api/users/ {
            proxy_pass http://users_api/api/v1/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户上传文件（头像等）
        location /uploads/ {
            proxy_pass http://users_api/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ========================================================================
        # SRS 媒体流服务
        # ========================================================================
        # HLS 流
        location /hls {
            alias /var/www/srs/live/;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        # HTTP-FLV 流
        location /live/ {
            proxy_pass http://srs_stream/live/;
            add_header Access-Control-Allow-Origin *;
        }

        # SRS Web 控制台
        location /srs {
            proxy_pass http://srs_stream;
        }

        # ========================================================================
        # 通用静态资源
        # ========================================================================
        location /static/ {
            alias /var/www/static/;
        }
    }
}