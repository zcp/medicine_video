events {}

http {
    include /etc/nginx/mime.types;

    # Docker 里使用内置 DNS：避免容器启动瞬间解析不到上游导致 nginx 直接退出
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ============================================================================
    # 上游服务定义
    # ============================================================================
    upstream core_api {
        zone core_api 64k;
        server live_core_service:8000 resolve;
    }
    upstream dl_api {
        zone dl_api 64k;
        server media_download_service:8001 resolve;
    }
    upstream users_api {
        zone users_api 64k;
        server user_service:8002 resolve;
    }
    upstream srs_stream {
        zone srs_stream 64k;
        server srs:8080 resolve;
    }

    # ============================================================================
    # 内部回调专用服务器（仅容器内部访问）
    # ============================================================================
    server {
        listen 8009;
        server_name _;

        location /api/v1/internal/srs/ {
            proxy_pass http://core_api/api/v1/internal/srs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================================================
    # Windows 本地开发：仅启用 HTTP（80），不启用 SSL，避免证书缺失导致 nginx 无法启动
    # ============================================================================
    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;
        client_body_timeout 60s;

        # ========================================================================
        # 直播核心服务媒体文件（必须放在所有 /api/ 路径之前）
        # ========================================================================
        location /media/ {
            alias /var/www/html/live-core-media/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;

            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
            }

            try_files $uri =404;
        }

        # ========================================================================
        # API 代理服务
        # ========================================================================
        location /api/image {
            proxy_pass https://a2.vzan.com;
            proxy_set_header Host a2.vzan.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Referer https://a2.vzan.com/;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";

            rewrite ^/api/image(.*)$ $1 break;
        }

        location /api/core/ {
            proxy_pass http://core_api/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 直播核心服务独立路由（专家 & 个人直播间等 /api/v1/ 前缀路径）
        # 必须放在 /api/v1/ 通用规则之前，使用 ^~ 确保优先匹配
        location ^~ /api/v1/experts {
            proxy_pass http://core_api/api/v1/experts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /api/v1/featured-experts {
            proxy_pass http://core_api/api/v1/featured-experts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /api/v1/users/me/rooms {
            proxy_pass http://core_api/api/v1/users/me/rooms;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /api/v1/users/me/followed-experts {
            proxy_pass http://core_api/api/v1/users/me/followed-experts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/dl/ {
            proxy_pass http://dl_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/ {
            proxy_pass http://dl_api/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        }

        # 用户服务：认证接口单独转发（/api/users/auth/ → /api/v1/auth/）
        # 必须放在 /api/users/ 之前，因为更长的前缀优先匹配
        location /api/users/auth/ {
            proxy_pass http://users_api/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户服务：管理端接口（/api/users/admin/ → /api/v1/admin/）
        location /api/users/admin/ {
            proxy_pass http://users_api/api/v1/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户服务：内部接口（/api/users/internal/ → /api/v1/internal/；V2 头像同步等）
        location /api/users/internal/ {
            proxy_pass http://users_api/api/v1/internal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户服务：用户信息接口（/api/users/me → /api/v1/users/me）
        location /api/users/ {
            proxy_pass http://users_api/api/v1/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================================================================
        # 用户上传文件（头像等）
        # ========================================================================
        location /uploads/ {
            proxy_pass http://users_api/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ========================================================================
        # SRS 媒体流服务
        # ========================================================================
        location /hls {
            alias /var/www/srs/live/;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        location /live/ {
            proxy_pass http://srs_stream/live/;
            add_header Access-Control-Allow-Origin *;
        }

        location /srs {
            proxy_pass http://srs_stream;
        }

        # ========================================================================
        # 用户服务前端（本地可不挂载；不影响 API 调试）
        # ========================================================================
        location /assets/ {
            root /var/www/html/user-service;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            root /var/www/html/user-service;
            index index.html;
            # Windows 本地开发默认不挂载前端构建产物，避免 try_files 造成内部重定向循环
            try_files $uri $uri/ =404;
        }
    }
}
