# ============================================
# 使用混合环境变量配置的 compose 文件示例
# ============================================
# 
# 配置方式：
# - .env.shared: 共享配置（数据库、JWT、Redis等）
# - .env.live_core: live_core_service 特定配置
# - .env.user: user_service 特定配置
# - .env.media_download: media_download_service 特定配置
#
# ============================================

services:
  live_core_service:
    build: ./backend/live_core_service
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      POSTGRES_DB: "live_core_test"  # 也可以在 compose 中直接设置
      ROOM_MEDIA_ROOT_PATH: "/app/media"
    env_file:
      - .env.shared           # 共享配置（数据库、JWT、Redis等）
      - .env.live_core        # 服务特定配置
    volumes:
      - /var/www/html/live-core-media:/app/media
    depends_on: []
    networks:
      - live-network

  media_download_service:
    build: ./backend/media_download_service
    restart: unless-stopped
    ports: ["8001:8001"]
    environment:
      POSTGRES_DB: "media_download_test"
    env_file:
      - .env.shared
      - .env.media_download
    volumes:
      - media_download:/media_download/storage
    networks:
      - live-network

  user_service:
    build: ./backend/users
    restart: unless-stopped
    ports: ["8002:8002"]
    environment:
      POSTGRES_DB: "users_service_test"
    env_file:
      - .env.shared
      - .env.user
    networks:
      - live-network

  celery_worker:
    build: ./backend/live_core_service
    restart: unless-stopped
    env_file:
      - .env.shared
      - .env.live_core  # 与 live_core_service 相同
    command: celery -A app.tasks.celery_app worker --include=app.tasks.session_processing -l info -c 10
    networks:
      - live-network

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports: ["5432:5432"]
    env_file:
      - .env.shared  # 只需要共享配置
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - pgdata:/var/lib/postgresql/data
    networks:
      - live-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    networks:
      - live-network

  srs:
    image: ossrs/srs:6
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./data/srs:/usr/local/srs/objs/nginx/html
      - ./logs/srs:/var/log/srs
      - ./srs/srs.conf:/usr/local/srs/conf/srs.conf
    entrypoint: ["./objs/srs", "-c", "/usr/local/srs/conf/srs.conf"]
    networks:
      - live-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80","443:443"]
    volumes:
      - /var/www/html/user-service:/var/www/html/user-service:ro
      - /var/www/html/media-download:/var/www/html/media-download:ro
      - /var/www/html/live-center:/var/www/html/live-center:ro
      - /var/www/html/live-core-media:/var/www/html/live-core-media:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./data/srs:/var/www/srs:ro
      - /var/www/mp.dayilive.com:/var/www/mp.dayilive.com:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [srs]
    networks:
      - live-network

volumes:
  pgdata:
  media_download:
  frontend-dist:
  user-frontend-dist:

networks:
  live-network:
    driver: bridge

