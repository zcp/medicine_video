<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tabs Admin API 测试</title>
<style>
body{font-family:system-ui,Segoe UI,Arial;margin:18px;background:#f6f8fb;color:#222}
.container{max-width:980px;margin:0 auto;background:#fff;padding:18px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,0.06)}
h1{font-size:18px;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.input,textarea,select{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px}
textarea{width:100%;height:120px;font-family:monospace}
button{padding:8px 12px;border-radius:6px;border:0;background:#4f6ef7;color:#fff;cursor:pointer}
button.secondary{background:#6c757d}
.result{margin-top:12px;padding:12px;border-radius:8px;background:#fafafa;border:1px solid #eee;max-height:420px;overflow:auto}
pre{font-size:13px;background:#fff;padding:10px;border-radius:6px;border:1px solid #eee;overflow:auto}
.kv{font-size:13px;margin-bottom:6px}
.small{font-size:12px;color:#666}
</style>
</head>
<body>
<div class="container">
  <h1>Tabs Admin API 测试页</h1>
  <div class="kv small">说明：按需填写后端地址、JWT、room_id、tab_id 和 JSON body（用于 POST/PATCH）。会显示 HTTP 状态、响应 JSON 与生成的 curl 命令。</div>

  <div class="row">
    <input id="apiBase" class="input" style="width:48%" placeholder="API Base (例如: http://124.220.235.226:8000/api/v1)" value="http://124.220.235.226:8000/api/v1">
    <input id="jwt" class="input" style="width:48%" placeholder="JWT Token (Authorization: Bearer ...)" />
  </div>

  <div class="row">
    <input id="roomId" class="input" style="width:24%" placeholder="room_id" />
    <input id="tabId" class="input" style="width:24%" placeholder="tab_id (PATCH/DELETE)" />
    <select id="contentType" class="input" style="width:24%">
      <option value="json">application/json</option>
    </select>
    <button onclick="getTabs()">GET 列表</button>
    <button class="secondary" onclick="clearResult()">清空</button>
  </div>

  <div style="margin-top:8px">
    <label class="small">POST / PATCH 请求体 (JSON)</label>
    <textarea id="body" placeholder='示例: {"title":"右侧栏","position":"right","config":{}}'></textarea>
  </div>

  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
    <button onclick="createTab()">POST (创建)</button>
    <button onclick="updateTab()">PATCH (更新)</button>
    <button onclick="deleteTab()">DELETE (删除)</button>
  </div>

  <div id="result" class="result" style="display:none"></div>
</div>

<script>
function show(html){
  const el = document.getElementById('result');
  el.style.display='block';
  el.innerHTML = html;
}

function clearResult(){
  const el=document.getElementById('result');
  el.style.display='none';
  el.innerHTML='';
}

function buildHeaders(){
  const jwt = document.getElementById('jwt').value.trim();
  const headers = { 'Accept': 'application/json' };
  if(jwt) headers['Authorization'] = 'Bearer ' + jwt;
  if(document.getElementById('contentType').value === 'json') headers['Content-Type'] = 'application/json';
  return headers;
}

async function fetchWithDetail(url, options){
  const start = Date.now();
  try{
    const res = await fetch(url, options);
    const duration = Date.now() - start;
    const status = res.status;
    const ok = res.ok;
    let text = await res.text();
    let data;
    try{ data = JSON.parse(text); } catch { data = { raw: text }; }
    // collect headers (may be limited by CORS)
    const headers = {};
    try{ res.headers.forEach((v,k)=>headers[k]=v); } catch(e){}
    return { ok, status, duration, data, headers, raw: text };
  }catch(err){
    return { ok:false, error: err.message };
  }
}

function buildCurl(method, url, headers, body){
  let cmd = ['curl -i -X', method, '"'+url+'"'];
  for(const k in headers){
    cmd.push("-H");
    cmd.push('"'+k+': '+headers[k]+'"');
  }
  if(body){
    const bodyStr = typeof body === 'string' ? body : JSON.stringify(body);
    cmd.push('--data-raw');
    cmd.push("'", bodyStr.replace(/'/g,"'\"'\"'"), "'");
  }
  return cmd.join(' ');
}

async function getTabs(){
  clearResult();
  const base = document.getElementById('apiBase').value.replace(/\/$/,'');
  const roomId = document.getElementById('roomId').value.trim();
  if(!roomId){ alert('请输入 room_id'); return; }
  const url = `${base}/admin/rooms/${encodeURIComponent(roomId)}/tabs`;
  const headers = buildHeaders();
  show('<div class="small">请求中...</div>');
  const res = await fetchWithDetail(url, { method:'GET', headers });
  renderResponse('GET '+url, res, buildCurl('GET', url, headers, null));
}

async function createTab(){
  clearResult();
  const base = document.getElementById('apiBase').value.replace(/\/$/,'');
  const roomId = document.getElementById('roomId').value.trim();
  if(!roomId){ alert('请输入 room_id'); return; }
  const url = `${base}/admin/rooms/${encodeURIComponent(roomId)}/tabs`;
  const headers = buildHeaders();
  let bodyText = document.getElementById('body').value.trim();
  if(!bodyText){ if(!confirm('body 为空，会发送空体吗？')) return; }
  let body = bodyText ? JSON.parseSafe ? JSON.parse(bodyText) : JSON.parse(bodyText) : null;
  show('<div class="small">请求中...</div>');
  const res = await fetchWithDetail(url, { method:'POST', headers, body: body ? JSON.stringify(body) : undefined });
  renderResponse('POST '+url, res, buildCurl('POST', url, headers, body));
}

async function updateTab(){
  clearResult();
  const base = document.getElementById('apiBase').value.replace(/\/$/,'');
  const roomId = document.getElementById('roomId').value.trim();
  const tabId = document.getElementById('tabId').value.trim();
  if(!roomId || !tabId){ alert('请输入 room_id 和 tab_id'); return; }
  const url = `${base}/admin/rooms/${encodeURIComponent(roomId)}/tabs/${encodeURIComponent(tabId)}`;
  const headers = buildHeaders();
  let bodyText = document.getElementById('body').value.trim();
  if(!bodyText){ if(!confirm('body 为空，会发送空体吗？')) return; }
  let body = bodyText ? JSON.parse(bodyText) : null;
  show('<div class="small">请求中...</div>');
  const res = await fetchWithDetail(url, { method:'PATCH', headers, body: body ? JSON.stringify(body) : undefined });
  renderResponse('PATCH '+url, res, buildCurl('PATCH', url, headers, body));
}

async function deleteTab(){
  clearResult();
  const base = document.getElementById('apiBase').value.replace(/\/$/,'');
  const roomId = document.getElementById('roomId').value.trim();
  const tabId = document.getElementById('tabId').value.trim();
  if(!roomId || !tabId){ alert('请输入 room_id 和 tab_id'); return; }
  const url = `${base}/admin/rooms/${encodeURIComponent(roomId)}/tabs/${encodeURIComponent(tabId)}`;
  const headers = buildHeaders();
  if(!confirm('确认 DELETE?')) return;
  show('<div class="small">请求中...</div>');
  const res = await fetchWithDetail(url, { method:'DELETE', headers });
  renderResponse('DELETE '+url, res, buildCurl('DELETE', url, headers, null));
}

function renderResponse(title, res, curlCmd){
  if(!res){
    show('<div class="small">无响应</div>');
    return;
  }
  if(res.ok === false && res.error){
    show(`<h3>${title}</h3>
      <div class="small" style="color:#c34">网络错误: ${res.error}</div>
      <pre>${curlCmd}</pre>`);
    return;
  }
  const headersHtml = Object.keys(res.headers||{}).length
    ? '<pre>'+JSON.stringify(res.headers, null, 2)+'</pre>' : '<div class="small">响应头不可访问（CORS 限制）</div>';
  const bodyPretty = typeof res.data === 'object' ? JSON.stringify(res.data, null, 2) : (res.raw||'');
  const html = `
    <h3 style="margin:0 0 8px 0">${title}</h3>
    <div class="kv"><strong>状态：</strong> ${res.status} <span class="small">(${res.ok ? 'OK':'Error'})</span></div>
    <div class="kv"><strong>耗时：</strong> ${res.duration ?? '-'} ms</div>
    <div><strong>响应头：</strong>${headersHtml}</div>
    <div style="margin-top:8px"><strong>响应体：</strong><pre>${escapeHtml(bodyPretty)}</pre></div>
    <div style="margin-top:8px"><strong>curl:</strong><pre>${escapeHtml(curlCmd)}</pre></div>
  `;
  show(html);
}

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// small JSON parse guard
(function(){
  window.JSON.parseSafe = function(s){
    try{ return JSON.parse(s); } catch(e){ alert('JSON 解析错误: '+e.message); throw e; }
  }
})();
</script>
</body>
</html>
