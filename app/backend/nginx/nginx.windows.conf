events {}

http {
    include /etc/nginx/mime.types;

    # ============================================================================
    # 上游服务定义（Docker 内部网络，容器名称作为 hostname）
    # ============================================================================
    upstream core_api {
        server live_core_service:8000;
    }
    upstream dl_api {
        server media_download_service:8001;
    }
    upstream users_api {
        server user_service:8002;
    }
    upstream srs_stream {
        server srs:8080;
    }

    # ============================================================================
    # Windows 本地开发 HTTP 服务器（无 SSL）
    # 访问地址：http://localhost:8080/...
    # ============================================================================
    server {
        listen 80;
        server_name _;  # 匹配任意 hostname（localhost / 127.0.0.1 均可）

        client_max_body_size 10M;
        client_body_timeout 60s;

        # ========================================================================
        # 媒体文件（直播封面、图片等）
        # ========================================================================
        location /media/ {
            alias /var/www/html/live-core-media/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
            types {
                image/jpeg jpg jpeg;
                image/png  png;
                image/gif  gif;
                image/webp webp;
            }
            try_files $uri =404;
        }

        # ========================================================================
        # API 代理（路径映射与云端一致，方便前端配置复用）
        # /api/core/*  →  live_core_service:8000/api/v1/*
        # /api/users/* →  user_service:8002/api/v1/*
        # /api/dl/*    →  media_download_service:8001/*
        # ========================================================================
        location /api/core/ {
            proxy_pass http://core_api/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户服务：认证接口与用户信息接口分开转发，避免 /auth/* 被误转到 /api/v1/users/*
        location /api/users/auth/ {
            proxy_pass http://users_api/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PR 1B: 用户服务管理端/admin/users、/admin/products、/admin/subscriptions
        location /api/users/admin/ {
            proxy_pass http://users_api/api/v1/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PR 1B: 用户服务内部接口/internal/users/batch、/internal/users/{uuid}/avatar
        location /api/users/internal/ {
            proxy_pass http://users_api/api/v1/internal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/users/ {
            proxy_pass http://users_api/api/v1/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/dl/ {
            proxy_pass http://dl_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================================================================
        # SRS 流媒体服务
        # ========================================================================
        location /hls {
            alias /var/www/srs/live/;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }
        }

        location /live/ {
            proxy_pass http://srs_stream/live/;
            add_header Access-Control-Allow-Origin *;
        }

        # ========================================================================
        # 用户上传文件（头像等）
        # ========================================================================
        location /uploads/ {
            proxy_pass http://users_api/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ========================================================================
        # 默认响应（未匹配路径返回 404，避免空白页）
        # ========================================================================
        location / {
            return 404 '{"code": 404, "message": "Not Found - 本地开发环境无前端静态文件"}';
            add_header Content-Type application/json;
        }
    }
}
