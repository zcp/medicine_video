[tool:pytest]
# Pytest配置文件

# 自定义标记
markers =
    integration: 集成测试，需要真实外部服务（如Redis、数据库）
    unit: 单元测试，不依赖外部服务
    slow: 运行较慢的测试

# 测试目录
testpaths = tests

# 异步测试配置
asyncio_mode = auto

# 输出配置
addopts = 
    -v
    --tb=short
    --strict-markers
    
# 控制台输出
console_output_style = progress

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning 