services:
  srs:
    image: ossrs/srs:6
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./data/srs:/usr/local/srs/objs/nginx/html
      - ./logs/srs:/var/log/srs
      - ./srs/srs.conf:/usr/local/srs/conf/srs.conf # 挂载你的 srs.conf 文件
    entrypoint: ["./objs/srs", "-c", "/usr/local/srs/conf/srs.conf"] # 明确指定使用 srs.conf

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80","443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./data/srs:/var/www/srs:ro
    depends_on: [srs]