version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
      # 主库，可留空，下面脚本再建
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 自动建库脚本
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

  celery_worker:
    build: ./backend/live_core_service   # 与主服务共用镜像
    restart: unless-stopped
    depends_on: [postgres, redis]
    env_file: .env.docker
    command: >
      celery -A app.celery worker -l info -P gevent -c 100

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]

  live_core_service:
    build: ./backend/live_core_service
    restart: unless-stopped
    ports:
      - "8008:8000"
    environment:
      POSTGRES_DB: "live_core_test"
    env_file: .env.docker

  media_download_service:
    build: ./backend/media_download_service
    restart: unless-stopped
    expose: ["8001"]
    environment:
      POSTGRES_DB: "media_download_test"
    env_file: .env.docker

  user_service:
    build: ./backend/users
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - user_uploads:/app/uploads
    environment:
      POSTGRES_DB: "users_service_test"
    env_file: .env.docker

  srs:
    image: ossrs/srs:5
    restart: unless-stopped
    expose: ["1935","8080"]
    volumes: ["./data/srs:/usr/local/srs/objs/nginx/html"]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80","443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./data/srs:/var/www/srs:ro
    depends_on: [srs,live_core_service,media_download_service]

volumes:
  pgdata:
  user_uploads: