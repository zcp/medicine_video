services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports: ["5432:5432"]
    env_file: .env.docker
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
volumes:
  pgdata: