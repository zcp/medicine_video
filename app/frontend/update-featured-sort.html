<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔄 焦点图排序修改工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        
        .info-box h3 {
            color: #1976d2;
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .info-box ul {
            margin-left: 20px;
            color: #555;
            line-height: 1.8;
        }
        
        .btn-group {
            margin-bottom: 30px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }
        
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .featured-list {
            margin-top: 20px;
        }
        
        .featured-item {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        .featured-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .item-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            flex: 1;
        }
        
        .item-sort {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sort-label {
            color: #666;
            font-size: 14px;
        }
        
        .sort-input {
            width: 80px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            text-align: center;
        }
        
        .sort-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .item-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 13px;
            color: #666;
            margin-top: 10px;
        }
        
        .info-label {
            font-weight: 600;
            color: #555;
        }
        
        .success {
            background: #d4edda;
            border-left: 4px solid #28a745;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
            color: #155724;
        }
        
        .error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
            color: #721c24;
        }
        
        .update-btn {
            background: #28a745;
            margin-top: 10px;
        }
        
        .update-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 焦点图排序修改工具</h1>
        <p class="subtitle">快速调整焦点图显示顺序</p>
        
        <div class="info-box">
            <h3>💡 使用说明</h3>
            <ul>
                <li>数字越小，焦点图显示越靠前（0最靠前）</li>
                <li>可以设置为：0, 1, 2, 3... 或其他任意数字</li>
                <li>修改输入框中的数字，然后点击"更新"按钮</li>
                <li>支持批量修改，修改完统一提交</li>
            </ul>
        </div>
        
        <!-- Token输入区域 -->
        <div style="background: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
            <h3 style="color: #856404; margin-bottom: 10px; font-size: 16px;">🔑 Token认证</h3>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input 
                    type="password" 
                    id="tokenInput" 
                    placeholder="请输入JWT Token（从登录页面获取）" 
                    style="flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 4px; font-size: 14px;"
                />
                <button onclick="saveToken()" style="background: #ffc107; color: #000; padding: 10px 20px;">
                    💾 保存Token
                </button>
                <button onclick="clearToken()" style="background: #dc3545; padding: 10px 20px;">
                    🗑️ 清除
                </button>
            </div>
            <div style="margin-top: 10px; font-size: 13px; color: #856404;">
                <strong>获取方法：</strong>
                <ol style="margin-left: 20px; margin-top: 5px; line-height: 1.8;">
                    <li>访问 <a href="https://mp.dayilive.com/#/pages/auth/login" target="_blank" style="color: #0066cc;">H5登录页面</a></li>
                    <li>登录后按F12，在Console标签运行：<code style="background: #f0f0f0; padding: 2px 6px; border-radius: 3px;">localStorage.getItem('auth_token')</code></li>
                    <li>复制输出的Token（不含引号），粘贴到上面输入框</li>
                    <li>点击"💾 保存Token"，然后就可以使用工具了</li>
                </ol>
            </div>
        </div>
        
        <div class="btn-group">
            <button onclick="loadFeaturedList()">📋 加载焦点图列表</button>
            <button onclick="autoFixSort()">🔧 自动修复（设为0,1,2,3...）</button>
        </div>
        
        <div id="result"></div>
        <div id="featuredList" class="featured-list"></div>
    </div>
    
    <script>
        // API配置
        const API_BASE = 'https://mp.dayilive.com/api/core';
        let token = '';
        let featuredItems = [];
        
        // 页面加载时尝试从localStorage读取Token
        window.addEventListener('load', () => {
            console.log('🚀 焦点图排序修改工具已加载');
            
            // 尝试读取已保存的Token
            const savedToken = localStorage.getItem('featured_admin_token');
            if (savedToken) {
                token = savedToken;
                document.getElementById('tokenInput').value = savedToken;
                showSuccess('✅ 已加载保存的Token，可以直接使用工具');
            } else {
                showError('❌ 未找到Token，请先登录：https://mp.dayilive.com/#/pages/auth/login');
            }
        });
        
        // 保存Token
        function saveToken() {
            const inputToken = document.getElementById('tokenInput').value.trim();
            if (!inputToken) {
                alert('请先输入Token！');
                return;
            }
            
            // 简单验证JWT格式（三段base64）
            const parts = inputToken.split('.');
            if (parts.length !== 3) {
                const confirm = window.confirm(
                    '⚠️ Token格式警告\n\n' +
                    'JWT Token应该是三段用点号分隔的字符串\n' +
                    '例如: eyJhbGc...eyJ1c2Vy...SflKxw\n\n' +
                    '您输入的Token格式不正确，是否仍要保存？'
                );
                if (!confirm) return;
            }
            
            token = inputToken;
            localStorage.setItem('featured_admin_token', inputToken);
            showSuccess('✅ Token已保存！现在可以使用工具了');
            console.log('✅ Token已保存到localStorage');
        }
        
        // 清除Token
        function clearToken() {
            token = '';
            document.getElementById('tokenInput').value = '';
            localStorage.removeItem('featured_admin_token');
            showError('🗑️ Token已清除');
            console.log('🗑️ Token已从localStorage清除');
        }
        
        // 获取Token
        function getToken() {
            if (!token) {
                token = localStorage.getItem('featured_admin_token');
                if (!token) {
                    showError('❌ 未找到Token，请先输入并保存Token');
                    return null;
                }
            }
            return token;
        }
        
        // 加载焦点图列表
        async function loadFeaturedList() {
            const token = getToken();
            if (!token) return;
            
            showLoading('正在加载焦点图列表...');
            
            try {
                const response = await fetch(`${API_BASE}/featured-content/admin`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                console.log('📥 焦点图列表:', result);
                
                // 处理不同的响应格式
                featuredItems = result.data?.items || result.data || result.items || [];
                
                if (!Array.isArray(featuredItems)) {
                    featuredItems = [featuredItems];
                }
                
                if (featuredItems.length === 0) {
                    showError('⚠️ 没有找到任何焦点图');
                    return;
                }
                
                // 按当前sort_order排序
                featuredItems.sort((a, b) => a.sort_order - b.sort_order);
                
                renderFeaturedList();
                showSuccess(`✅ 成功加载 ${featuredItems.length} 个焦点图`);
                
            } catch (error) {
                console.error('❌ 加载失败:', error);
                showError(`❌ 加载失败: ${error.message}`);
            }
        }
        
        // 渲染焦点图列表
        function renderFeaturedList() {
            const container = document.getElementById('featuredList');
            
            if (featuredItems.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999;">暂无数据</p>';
                return;
            }
            
            container.innerHTML = featuredItems.map((item, index) => `
                <div class="featured-item" data-id="${item.id}">
                    <div class="item-header">
                        <div class="item-title">${item.title}</div>
                        <div class="item-sort">
                            <span class="sort-label">排序号:</span>
                            <input 
                                type="number" 
                                class="sort-input" 
                                value="${item.sort_order}"
                                data-id="${item.id}"
                                data-original="${item.sort_order}"
                                min="0"
                                step="1"
                            />
                        </div>
                    </div>
                    <div class="item-info">
                        <div><span class="info-label">ID:</span> ${item.id}</div>
                        <div><span class="info-label">类型:</span> ${item.target_type}</div>
                        <div><span class="info-label">状态:</span> ${item.is_active ? '✅ 启用' : '❌ 禁用'}</div>
                        <div><span class="info-label">开始时间:</span> ${formatDate(item.start_at)}</div>
                    </div>
                    <button class="update-btn" onclick="updateSortOrder('${item.id}')">
                        🔄 更新此项
                    </button>
                </div>
            `).join('');
        }
        
        // 更新单个焦点图的排序
        async function updateSortOrder(contentId) {
            const token = getToken();
            if (!token) return;
            
            const input = document.querySelector(`.sort-input[data-id="${contentId}"]`);
            const newSortOrder = parseInt(input.value);
            const originalSortOrder = parseInt(input.dataset.original);
            
            if (newSortOrder === originalSortOrder) {
                showError('⚠️ 排序号未改变，无需更新');
                return;
            }
            
            showLoading(`正在更新排序号: ${originalSortOrder} → ${newSortOrder}`);
            
            // 🔧 使用正确的PATCH API
            const patchUrl = `${API_BASE}/featured-content/admin/${contentId}`;
            console.log('📡 发送PATCH请求:', {
                url: patchUrl,
                contentId: contentId,
                sort_order: newSortOrder
            });
            
            try {
                const response = await fetch(patchUrl, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        sort_order: newSortOrder
                    })
                });
                
                console.log('📥 响应状态:', response.status, response.statusText);
                
                if (!response.ok) {
                    let errorMessage = `HTTP ${response.status}: ${response.statusText}`;
                    try {
                        const error = await response.json();
                        errorMessage = error.message || error.detail || errorMessage;
                        console.error('❌ 错误详情:', error);
                    } catch (e) {
                        console.error('❌ 无法解析错误响应');
                    }
                    throw new Error(errorMessage);
                }
                
                const result = await response.json();
                console.log('✅ 更新成功，完整响应:', result);
                
                // 更新本地数据
                input.dataset.original = newSortOrder;
                
                showSuccess(`✅ 排序号已更新: ${originalSortOrder} → ${newSortOrder}`);
                
                // 3秒后重新加载列表
                setTimeout(loadFeaturedList, 3000);
                
            } catch (error) {
                console.error('❌ 更新失败:', error);
                showError(`❌ 更新失败: ${error.message}\n\n请检查Console查看详细日志`);
                input.value = originalSortOrder; // 恢复原值
            }
        }
        
        // 自动修复排序（设为0,1,2,3...）
        async function autoFixSort() {
            if (featuredItems.length === 0) {
                showError('⚠️ 请先加载焦点图列表');
                return;
            }
            
            const confirm = window.confirm(
                `确定要自动修复排序吗？\n\n` +
                `将按当前顺序设置为：0, 1, 2, 3...\n` +
                `共 ${featuredItems.length} 个焦点图\n\n` +
                `使用PATCH API: ${API_BASE}/featured-content/admin/{id}`
            );
            
            if (!confirm) return;
            
            const token = getToken();
            if (!token) return;
            
            showLoading('正在批量更新排序...');
            
            let successCount = 0;
            let errorCount = 0;
            const errors = [];
            
            for (let i = 0; i < featuredItems.length; i++) {
                const item = featuredItems[i];
                const newSortOrder = i;
                
                if (item.sort_order === newSortOrder) {
                    console.log(`⏭️ 跳过 ${item.title}: 排序已是${newSortOrder}`);
                    successCount++;
                    continue;
                }
                
                const patchUrl = `${API_BASE}/featured-content/admin/${item.id}`;
                console.log(`🔄 [${i+1}/${featuredItems.length}] 更新 ${item.title}: ${item.sort_order} → ${newSortOrder}`);
                
                try {
                    const response = await fetch(patchUrl, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            sort_order: newSortOrder
                        })
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        console.log(`✅ 成功更新 ${item.title}:`, result);
                        successCount++;
                    } else {
                        const error = await response.json().catch(() => ({}));
                        console.error(`❌ 更新失败 ${item.title} (${response.status}):`, error);
                        errors.push(`${item.title}: ${error.message || error.detail || response.statusText}`);
                        errorCount++;
                    }
                    
                    // 延迟150ms，避免请求过快
                    await new Promise(resolve => setTimeout(resolve, 150));
                    
                } catch (error) {
                    console.error(`❌ 请求异常 ${item.title}:`, error);
                    errors.push(`${item.title}: ${error.message}`);
                    errorCount++;
                }
            }
            
            let message = `✅ 批量更新完成！\n成功: ${successCount} 个\n失败: ${errorCount} 个`;
            if (errors.length > 0) {
                message += '\n\n失败详情:\n' + errors.slice(0, 3).join('\n');
                if (errors.length > 3) {
                    message += `\n...还有${errors.length - 3}个错误（查看Console）`;
                }
            }
            
            showSuccess(message);
            
            // 重新加载列表
            setTimeout(loadFeaturedList, 2000);
        }
        
        // 工具函数
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleString('zh-CN');
        }
        
        function showLoading(message) {
            document.getElementById('result').innerHTML = `
                <div class="loading">⏳ ${message}</div>
            `;
        }
        
        function showSuccess(message) {
            document.getElementById('result').innerHTML = `
                <div class="success">${message.replace(/\n/g, '<br>')}</div>
            `;
        }
        
        function showError(message) {
            document.getElementById('result').innerHTML = `
                <div class="error">${message.replace(/\n/g, '<br>')}</div>
            `;
        }
    </script>
</body>
</html>
